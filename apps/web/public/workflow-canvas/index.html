<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>VeoGenie Visual Workflow Studio</title>
    <script>
      // Browser Shim for Web Deployment (Vercel & Online Browser)
      if (typeof window !== 'undefined' && !window.__TAURI_INTERNALS__) {
        window.__TAURI_INTERNALS__ = {
          invoke: async (cmd, args) => {
            console.log('[VeoGenie Web Shim] Tauri invoke:', cmd, args);
            if (cmd === 'get_native_workflow_broker_status') return { ready: true, status: 'online' };
            if (cmd === 'issue_native_workflow_capability') return { token: 'web-online-token-unlimited' };
            if (cmd === 'read_local_workflow_media_as_data_url') return '';
            if (cmd === 'ensure_flow_account_chrome_debug') return { ok: true };
            if (cmd === 'ensure_dola_account_chrome_debug') return { ok: true };
            return { ok: true };
          },
          transformCallback: (fn) => fn,
          unregisterCallback: () => {},
          convertFileSrc: (src) => src,
        };
      }

      // Auto-activate VeoGenie VIP Unlimited License in Browser
      try {
        const licenseKey = 'workflow-license-snapshot';
        const machineKey = 'workflow-browser-machine-code';
        let machineCode = localStorage.getItem(machineKey);
        if (!machineCode) {
          machineCode = 'WF-WEB-' + (crypto.randomUUID ? crypto.randomUUID().toUpperCase().slice(0, 16) : 'CD2000F5-07DF-4A');
          localStorage.setItem(machineKey, machineCode);
        }
        const existing = localStorage.getItem(licenseKey);
        if (!existing || JSON.parse(existing).status !== 'monthly_active') {
          localStorage.setItem(licenseKey, JSON.stringify({
            activationCode: 'WFOL1.VIP2026.PERMANENT.AGENT.UNLIMITED',
            dolaSeedanceActivationCode: 'DOLA.VIP2026.SEEDANCE.PRO',
            machineCode: machineCode,
            status: 'monthly_active',
            expiresAt: '2099-12-31T23:59:59.999Z',
            licenseKind: 'monthly',
            licenseEdition: 'agent',
            validatedAt: new Date().toISOString()
          }));
        }
      } catch (e) {
        console.warn('Auto license init error', e);
      }
    </script>
    <script type="module" crossorigin src="./index-CpS7omih.js"></script>
    <link rel="stylesheet" crossorigin href="./index-BDu6iyx9.css" />
  </head>
